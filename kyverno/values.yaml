# kyverno/values.yaml
#
# High-availability install values for the Kyverno Helm chart (kyverno/kyverno).
# Target: platform-security issue #1 — "Install Kyverno in high availability"
#
# Default `helm install kyverno kyverno/kyverno` (what we used in the local lab)
# runs a single replica of each controller — fine for a throwaway dev cluster,
# not acceptable for something that admission-controls a real shared cluster:
# if the single admission-controller pod is mid-restart when a deploy happens,
# every apply in the cluster either hangs or fails depending on failurePolicy.
#
# This file only sets what's needed for HA. Chart defaults are used for
# everything else, and version/image tags stay out of this file — those belong
# in the Helm release command / CI workflow, not hardcoded here.

admissionController:
  replicas: 3

  # Never let a voluntary disruption (node drain, cluster upgrade) take
  # availability below 2 replicas. Without this, a rolling node upgrade could
  # legally evict 2 of 3 replicas at once and leave a single point of failure
  # during the exact window the cluster is already being disrupted.
  podDisruptionBudget:
    minAvailable: 2

  # Spread the 3 replicas across different nodes (and AZs, once the real
  # multi-AZ cluster exists) rather than letting the scheduler pack them
  # together. Without this, losing one node could plausibly take out 2+
  # replicas at once, defeating the point of replicas: 3.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi
    # Deliberately no cpu limit: CPU limits on a Go binary can cause
    # throttling under load, which is exactly wrong for something sitting in
    # the admission path. Memory is capped so a leak/spike gets OOM-killed
    # and restarted rather than pressuring the node.

backgroundController:
  replicas: 2
  podDisruptionBudget:
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi
  # Leader election is on by default when replicas > 1 — only one replica
  # actively processes background scans/mutations at a time, the rest are
  # hot standby. No config needed here beyond replicas: 2.

reportsController:
  replicas: 2
  podDisruptionBudget:
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi
  # Same leader-election behavior as backgroundController — this is what
  # generates the PolicyReports we saw in Policy Reporter.

cleanupController:
  replicas: 2
  podDisruptionBudget:
    minAvailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # Lowest resource footprint of the four — it only runs scheduled cleanup
  # of expired/ttl'd resources, not on the live admission path.